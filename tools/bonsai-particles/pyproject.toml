[project]
name = "bonsai-particles"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2,<3",
    "Pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
bonsai-particles = "bonsai_particles.extract:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
