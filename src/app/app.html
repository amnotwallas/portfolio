<div class="page-shell">
  <header class="site-header">
    <a class="monogram" href="#home" aria-label="Walter Ambriz, home">WA<span>.</span></a>

    <nav class="header-nav" [attr.aria-label]="copy().navLabel">
      <div class="language-switch" [attr.aria-label]="copy().languageLabel">
        <button type="button" [class.active]="language() === 'en'" [attr.aria-pressed]="language() === 'en'" (click)="setLanguage('en')">EN</button>
        <button type="button" [class.active]="language() === 'es'" [attr.aria-pressed]="language() === 'es'" (click)="setLanguage('es')">ES</button>
      </div>
    </nav>
  </header>

  <main id="home" class="content">
    <app-bonsai-canvas class="hero-artwork" aria-hidden="true" />
    <section class="hero" [attr.aria-label]="copy().heroLabel">
      <p class="eyebrow">{{ copy().role }}</p>
      <h1>{{ profile.name }}<span>.</span></h1>
      <h2>{{ copy().headlineLine1 }} {{ copy().headlineLine2 }}</h2>
      <p class="summary">{{ copy().summary }}</p>
      <div class="experience" [attr.aria-label]="copy().experienceLabel">
        <span>{{ copy().experienceRole }} <i>·</i> {{ profile.company }}</span>
        <span>{{ copy().experienceSubtitle }} <i>·</i> {{ copy().experienceDate }}</span>
      </div>

      <div class="hero-actions">
        <a class="cv-link" [href]="profile.cvUrl" download (click)="downloadCv($event)">
          {{ copy().downloadCv }} <span aria-hidden="true">↓</span>
        </a>
        <button type="button" class="icon-link" [attr.aria-label]="copy().emailAction" [attr.data-tooltip]="copy().emailAction" (click)="copyEmail()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3 7 9 6 9-6" />
          </svg>
        </button>
        <a class="icon-link" [href]="profile.linkedinUrl" target="_blank" rel="noopener noreferrer" [attr.aria-label]="copy().linkedinAction" [attr.data-tooltip]="copy().linkedinAction">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <path d="M5.25 8.5h3v10h-3v-10Zm1.5-4.5a1.75 1.75 0 1 0 0 3.5 1.75 1.75 0 0 0 0-3.5Zm3.5 4.5h2.88v1.37h.04a3.16 3.16 0 0 1 2.84-1.56c3.04 0 3.61 2 3.61 4.6v5.59h-3v-4.96c0-1.18-.02-2.7-1.65-2.7-1.65 0-1.9 1.28-1.9 2.61v5.05h-3V8.5Z" />
          </svg>
        </a>
        <a class="icon-link" [href]="profile.githubUrl" target="_blank" rel="noopener noreferrer" [attr.aria-label]="copy().githubAction" [attr.data-tooltip]="copy().githubAction">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.08c-3.1.68-3.76-1.31-3.76-1.31-.5-1.29-1.24-1.63-1.24-1.63-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .1.75 1.77 3.46 1.35.1-.72.39-1.21.7-1.49-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.15a10.6 10.6 0 0 1 5.55 0c2.11-1.45 3.05-1.15 3.05-1.15.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.29-2.61 5.24-5.1 5.52.4.35.75 1.03.75 2.08v3.11c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z" />
          </svg>
        </a>
      </div>
      <span class="copy-feedback" role="status" aria-live="polite">{{ feedback() }}</span>
    </section>
  </main>
</div>
